<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <linearGradient id="blueTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#256DFF" />
      <stop offset="100%" stop-color="#0A5CFF" />
    </linearGradient>
    <linearGradient id="cyanHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0A5CFF" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer D shape with stacked dimensional layers -->
  <!-- Upper vibrant blue sweep -->
  <path d="M 120 100 
           H 280 
           C 360 100 420 160 420 240 
           C 420 265 412 288 398 308 
           L 362 268 
           C 345 240 310 220 270 220 
           H 200 
           L 120 300 
           V 100 Z" 
        fill="url(#blueTop)" />
        
  <!-- Mid Layer Band -->
  <path d="M 120 325 
           L 195 250 
           H 270 
           C 305 250 338 270 355 295 
           L 395 350 
           C 380 375 358 395 330 405 
           L 290 355 
           C 275 335 250 320 220 320 
           H 155 
           L 120 355 Z" 
        fill="#0D2063" />

  <!-- Bottom Deep Navy Base Layer -->
  <path d="M 120 380 
           L 185 315 
           H 230 
           C 255 315 278 328 290 345 
           L 325 395 
           C 290 415 245 425 200 425 
           H 120 
           V 380 Z" 
        fill="#070E2C" />

  <!-- Diagonal Accent Divider Line in Cyan -->
  <path d="M 120 305 L 200 225 H 272" 
        stroke="#22D3EE" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.8" />
</svg>
